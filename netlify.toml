# Templa API (Netlify Functions)
[functions]
  directory = "netlify/functions"

[functions.api]
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js", "transbank-sdk"]

# Servir la API Express bajo /api/*
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[build.environment]
  NODE_VERSION = "20"