# Templa API (Netlify Functions)
[build]
  publish = "netlify/site"

[functions]
  directory = "netlify/functions"

[functions.api]
  node_bundler = "esbuild"

# Servir la API Express bajo /api/*
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

[build.environment]
  NODE_VERSION = "20"