<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Templa — Plantillas premium y gratuitas para tu próximo proyecto</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Marketplace de plantillas Angular premium con vista previa en vivo, pago único y una sección de plantillas gratuitas de calidad real.">
  <meta name="theme-color" content="#0a0b10">
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Open Graph / Twitter base -->
  <meta property="og:site_name" content="Templa">
  <meta property="og:locale" content="es_CL">
  <meta property="og:type" content="website">
  <meta property="og:url" content="/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Templa — Plantillas premium y gratuitas">

  <!-- Fuentes: cargadas sin bloquear el render (preconnect + no-bloqueante) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap"
    media="print"
    onload="this.media='all'"
  >
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap">
  </noscript>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('templa.theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
