<div class="admin-shell">
  <aside class="sidebar" [class.open]="sidebarOpen()">
    <header class="sidebar-head">
      <a routerLink="/" class="logo-link" title="Volver a Templa">
        <span class="mark"></span>
        <span class="word">Templa</span>
      </a>
      <span class="badge-admin">Admin</span>
    </header>

    <nav class="sidebar-nav">
      <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a routerLink="/admin/orders" routerLinkActive="active" (click)="closeSidebar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        Pedidos
      </a>
      <a routerLink="/admin/templates" routerLinkActive="active" (click)="closeSidebar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        Plantillas
      </a>
      <a routerLink="/admin/publish" routerLinkActive="active" (click)="closeSidebar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Publicar
      </a>
      <a routerLink="/admin/users" routerLinkActive="active" (click)="closeSidebar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Usuarios
      </a>
      <a routerLink="/admin/audit" routerLinkActive="active" (click)="closeSidebar()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Auditoría
      </a>
    </nav>

    <footer class="sidebar-foot">
      <a routerLink="/" class="back-link" (click)="closeSidebar()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Volver a Templa
      </a>
      @if (auth.user(); as u) {
        <div class="admin-info">
          <span class="avatar">{{ (u.name || u.email) | slice: 0 : 1 | uppercase }}</span>
          <div>
            <b>{{ u.name || 'Admin' }}</b>
            <small>{{ u.email }}</small>
          </div>
          <button class="btn-logout" (click)="logout()" title="Cerrar sesión">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      }
    </footer>
  </aside>

  <div class="sidebar-overlay" [class.visible]="sidebarOpen()" (click)="closeSidebar()"></div>

  <div class="admin-main">
    <header class="topbar">
      <button class="hamburger" (click)="toggleSidebar()" aria-label="Menú admin">
        <span></span><span></span><span></span>
      </button>
      <div class="topbar-spacer"></div>
    </header>

    <div class="admin-content">
      <router-outlet />
    </div>
  </div>
</div>
